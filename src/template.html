<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accurate Logistics API Documentation</title>
	<meta name="description" content="Send shipments to your shipping company and get their status updates: the Accurate shipping API.">
	<link rel="icon" href="favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="apple-touch-icon" href="favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script>
		// the saved theme before the page paints, so it doesn't flash
		try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
	</script>
</head>
<body>
	<header class="topbar">
		<button class="menu-toggle" type="button" aria-label="Open the menu" aria-expanded="false">
			<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
		<a class="brand" href="#getting-started">
			<img src="Accurate-logistics.png" alt="Accurate Logistics" height="44">
			<span>API</span>
		</a>
		<div class="topbar-end">
			<button class="theme-toggle" type="button" aria-label="Switch between light and dark">
				<svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				<svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
			</button>
		</div>
	</header>

	<div class="layout">
		<nav class="sidebar" aria-label="Documentation">
			<input class="search" type="search" placeholder="Search…" aria-label="Search the documentation">
			{{nav}}
		</nav>
		<div class="scrim" hidden></div>

		<main class="content">
			{{content}}
			<footer class="footer">© {{year}} Accurate · Questions? Contact your shipping company.</footer>
		</main>
	</div>

	<script src="app.js"></script>
</body>
</html>
