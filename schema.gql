	deliveredOrReturnedDate: DateFilterInput
	statusCode: [ShipmentStatusCode]
	deliveryTypeCode: ShipmentDeliveryTypeCode
	returnTypeCode: ShipmentReturnTypeCode
	pendingCustomerAdjusting: Boolean
