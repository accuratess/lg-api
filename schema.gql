type Query {
	listCountriesDropdown: [DropdownEntry]!
	listLookupEntriesDropdown(
		input: ListLookupEntriesFilterInput!
	): [DropdownEntry]
	shipment(
		id: Int
		code: String
	): Shipment
	calculateShipmentFees(
		input: CalculateShipmentFeesInput!
	): ShipmentFees!
	listShipmentTypesDropdown(
		serviceId: Int
		mobileActive: Boolean
	): [DropdownEntry]
	listPaymentTypesDropdown(
		input: ListPaymentTypesDropdownInput
	): [DropdownEntry]
	listShippingServicesDropdown(
		input: ListShippingServicesFilterInput
	): [DropdownEntry]!
	listZonesDropdown(
		input: ListZonesFilterInput
	): [DropdownEntry]
	listShipments(
		input: ListShipmentsFilterInput
		"""
		Limits number of fetched items. Maximum allowed value: 100.
		"""
		first: Int! = 10
		"""
		The offset from which items are returned.
		"""
		page: Int
	): ShipmentPaginator!
}

type Mutation {
	login(
		input: LoginInput!
	): UserWithToken!
	saveShipment(
		input: ShipmentInput!
	): Shipment
}

input BoxSizeInput {
	length: Float!
	width: Float!
	height: Float!
}

type Branch {
	id: Int!
	code: String!
	name: String!
	active: Boolean!
	main: Boolean!
	address: String
	phone: String
	fax: String
	country: Country
	warehouseSections: [WarehouseSection]
}

input CalculateShipmentFeesInput {
	customerTypeCode: CustomerTypeCode
	serviceId: Int!
	weight: Float!
	senderZoneId: Int
	senderSubzoneId: Int
	recipientZoneId: Int!
	recipientSubzoneId: Int!
	size: BoxSizeInput
	customerId: Int
	price: Float!
	priceTypeCode: ShipmentPriceTypeCode
	paymentTypeCode: ShipmentPaymentTypeCode
}

type Country {
	id: Int!
	code: String!
	name: String!
}

"""Customer type code"""
enum CustomerTypeCode {
  """Merchant"""
  MERCHANT

  """Individual"""
  INDIVIDUAL

  """Concierge"""
  CONCIERGE
}

scalar Date

input DateFilterInput {
	fromDays: Int
	fromDate: Date
	toDate: Date
}

scalar DateTime

input DeliveryAgentCustodyInput {
	deliveryAgentId: Int
}

type DropdownEntry {
	id: Int
	code: String
	name: String
}

input FilterZonesByServiceInput {
	serviceId: Int!
	customerId: Int
